function getStore(key, fallback) {
    try {
        const raw = localStorage.getItem("bookhub_" + key);
        if (!raw) {
            localStorage.setItem("bookhub_" + key, JSON.stringify(fallback));
            return JSON.parse(JSON.stringify(fallback));
        }
        return JSON.parse(raw);
    } catch (e) {
        return JSON.parse(JSON.stringify(fallback));
    }
}

function setStore(key, val) {
    try {
        localStorage.setItem("bookhub_" + key, JSON.stringify(val));
    } catch (e) {}
}

function getSessionUser() {
    try {
        const raw = sessionStorage.getItem("bookhub_usuario");
        return raw ? JSON.parse(raw) : null;
    } catch (e) {
        return null;

}

function setSessionUser(u) {
    if (u) {
        sessionStorage.setItem("bookhub_usuario", JSON.stringify(u));
    } else {
        sessionStorage.removeItem("bookhub_usuario");

}

function handleLogin(e) {
    e.preventDefault();
    const correo = e.target.correo.value.trim();
    const password = e.target.password.value.trim();
    const usuarios = getStore("usuarios", INITIAL_USUARIOS);

    const encontrado = usuarios.find(u => u.correo.toLowerCase() === correo.toLowerCase() && u.password === password);
    if (!encontrado) {
        navigate("login", {}, { error: "Correo o contraseña incorrectos. Verifica tus credenciales.", correoIngresado: correo });
        return;
    }
    if (encontrado.estado !== "ACTIVO") {
        navigate("login", {}, { error: "Tu cuenta se encuentra inactiva. Contacta al administrador.", correoIngresado: correo });
        return;
    }
    setSessionUser(encontrado);
    if (encontrado.rol === "ADMIN") {
        navigate("dashboard");
    } else {
        navigate("usuario");
    }
}

    const password = e.target.password.value.trim();
    const confirmarPassword = e.target.confirmarPassword.value.trim();

    if (password.length < 4) {
        navigate("registro", {}, { error: "La contraseña debe tener al menos 4 caracteres.", nombreIngresado: nombre, correoIngresado: correo });
        return;
    }
    if (password !== confirmarPassword) {
        navigate("registro", {}, { error: "Las contraseñas ingresadas no coinciden.", nombreIngresado: nombre, correoIngresado: correo });
        return;
    }

    const usuarios = getStore("usuarios", INITIAL_USUARIOS);
    if (usuarios.some(u => u.correo.toLowerCase() === correo.toLowerCase())) {
        navigate("registro", {}, { error: "El correo electrónico ya está registrado.", nombreIngresado: nombre, correoIngresado: correo });
        return;
    }

    const maxId = usuarios.reduce((m, u) => Math.max(m, u.idUsuario), 0);
    usuarios.push({
        idUsuario: maxId + 1,
        nombre,
        correo,
        password,
        rol: "USUARIO",
        estado: "ACTIVO"
    });
    setStore("usuarios", usuarios);
    navigate("login", { registro: "exitoso" });
}

function solicitarPrestamo(idLibro) {
    const usuario = getSessionUser();
    if (!usuario) {
        navigate("login");
        return;
    }
    const libros = getStore("libros", INITIAL_LIBROS);
    const prestamos = getStore("prestamos", INITIAL_PRESTAMOS);
    const libro = libros.find(l => l.idLibro === idLibro);

    if (!libro || libro.stock <= 0) {
        navigate("detalleLibro", { id: idLibro, error: "sinStock" });
        return;
    }

    const yaTiene = prestamos.some(p => p.idUsuario === usuario.idUsuario && p.idLibro === idLibro && p.estado === "PRESTADO");
    if (yaTiene) {
        navigate("detalleLibro", { id: idLibro, error: "yaPrestado" });
        return;
    }

    const hoy = new Date();
    const dev = new Date(hoy.getTime() + 7 * 24 * 60 * 60 * 1000);
    const fmt = d => String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();

    const maxId = prestamos.reduce((m, p) => Math.max(m, p.idPrestamo), 0);
    prestamos.push({
        idPrestamo: maxId + 1,
        idUsuario: usuario.idUsuario,
        idLibro: idLibro,
        fechaPrestamo: fmt(hoy),
        fechaDevolucion: fmt(dev),
        estado: "PRESTADO"
    });
    libro.stock -= 1;

    setStore("prestamos", prestamos);
    setStore("libros", libros);
    navigate("detalleLibro", { id: idLibro, exito: "prestado" });
}

function guardarLibroAdmin(e, idEditar) {
    e.preventDefault();
    const libros = getStore("libros", INITIAL_LIBROS);
    const autores = getStore("autores", INITIAL_AUTORES);
    const categorias = getStore("categorias", INITIAL_CATEGORIAS);

    const idAutor = parseInt(e.target.idAutor.value, 10);
    const idCategoria = parseInt(e.target.idCategoria.value, 10);
    const autorObj = autores.find(a => a.idAutor === idAutor);
    const catObj = categorias.find(c => c.idCategoria === idCategoria);

    const datos = {
        titulo: e.target.titulo.value.trim(),
        isbn: e.target.isbn.value.trim(),
        anio: parseInt(e.target.anio.value, 10),
        stock: parseInt(e.target.stock.value, 10),
        descripcion: e.target.descripcion.value.trim(),
        idAutor,
        nombreAutor: autorObj ? autorObj.nombre : "Autor General",
        idCategoria,
        nombreCategoria: catObj ? catObj.nombre : "General"
    };

    if (idEditar) {
        const idx = libros.findIndex(l => l.idLibro === idEditar);
        if (idx !== -1) libros[idx] = { idLibro: idEditar, ...datos };
    } else {
        const maxId = libros.reduce((m, l) => Math.max(m, l.idLibro), 0);
        libros.push({ idLibro: maxId + 1, ...datos });
    }
    setStore("libros", libros);
    navigate("libros");
}

function eliminarLibroAdmin(id) {
    if (!confirm("¿Deseas eliminar este libro?")) return;
    const libros = getStore("libros", INITIAL_LIBROS).filter(l => l.idLibro !== id);
    setStore("libros", libros);
    navigate("libros");
}

                        ${editar ? `<a href="#" onclick="navigate('prestamos'); return false;" class="btn btn-secondary ms-2">Cancelar</a>` : ""}
                    </div>
                </form>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-4">Lista de préstamos</h5>
                <table class="table table-hover align-middle">
                    <thead class="table-primary"><tr><th>ID</th><th>Usuario</th><th>Libro</th><th>Fecha préstamo</th><th>Fecha devolución</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody>
                        ${prestamos.map(p => {
                            const u = usuarios.find(x => x.idUsuario === p.idUsuario);
                            const l = libros.find(x => x.idLibro === p.idLibro);
                            return `
                            <tr>
                                <td>${p.idPrestamo}</td>
                                <td>${u ? u.nombre : ("Usuario #" + p.idUsuario)}</td>
                                <td>${l ? l.titulo : ("Libro #" + p.idLibro)}</td>
                                <td>${p.fechaPrestamo}</td>
                                <td>${p.fechaDevolucion}</td>
                                <td><span class="badge ${p.estado === "PRESTADO" ? "bg-warning text-dark" : "bg-success"}">${p.estado}</span></td>
                                <td>
                                    <a href="#" onclick="navigate('prestamos', { editId: ${p.idPrestamo} }); return false;" class="btn btn-sm btn-outline-primary">Editar</a>
                                    <a href="#" onclick="eliminarPrestamoAdmin(${p.idPrestamo}); return false;" class="btn btn-sm btn-outline-danger">Eliminar</a>
                                </td>
                            </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    `;
}

function guardarPrestamoAdmin(e, idEditar) {
    e.preventDefault();
    const prestamos = getStore("prestamos", INITIAL_PRESTAMOS);
    const libros = getStore("libros", INITIAL_LIBROS);
    const idUsuario = parseInt(e.target.idUsuario.value, 10);
    const idLibro = parseInt(e.target.idLibro.value, 10);
    const fechaPrestamo = e.target.fechaPrestamo.value.trim();
    const fechaDevolucion = e.target.fechaDevolucion.value.trim();
    const estado = e.target.estado.value;

    const libro = libros.find(l => l.idLibro === idLibro);

    if (idEditar) {
        const idx = prestamos.findIndex(p => p.idPrestamo === idEditar);
        if (idx !== -1) {
            const anterior = prestamos[idx];
            if (libro) {
                if (anterior.estado === "PRESTADO" && estado === "DEVUELTO") libro.stock += 1;
                if (anterior.estado === "DEVUELTO" && estado === "PRESTADO" && libro.stock > 0) libro.stock -= 1;
            }
            prestamos[idx] = { idPrestamo: idEditar, idUsuario, idLibro, fechaPrestamo, fechaDevolucion, estado };
        }
    } else {
        const maxId = prestamos.reduce((m, p) => Math.max(m, p.idPrestamo), 0);
        prestamos.push({ idPrestamo: maxId + 1, idUsuario, idLibro, fechaPrestamo, fechaDevolucion, estado });
        if (estado === "PRESTADO" && libro && libro.stock > 0) libro.stock -= 1;
    }
    setStore("prestamos", prestamos);
    setStore("libros", libros);
    navigate("prestamos");
}

function eliminarPrestamoAdmin(id) {
    if (!confirm("¿Eliminar este préstamo?")) return;
    setStore("prestamos", getStore("prestamos", INITIAL_PRESTAMOS).filter(p => p.idPrestamo !== id));
    navigate("prestamos");
}

// ============================================================================
// UTILIDADES INTERACTIVAS Y RENDER PRINCIPAL
// ============================================================================

function completarCredenciales(correo, password) {
    const c = document.getElementById("correoInput");
    const p = document.getElementById("passwordInput");
    if (c) c.value = correo;
    if (p) p.value = password;
}

function togglePassword() {
    const p = document.getElementById("passwordInput");
    if (p) p.type = (p.type === "password") ? "text" : "password";
}

function filtrarTarjetasEnVivo(texto) {
    const q = (texto || "").toLowerCase();
    document.querySelectorAll(".libro-item").forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? "block" : "none";
    });
}

function render() {
    const app = document.getElementById("app");
    switch (state.view) {
        case "login": app.innerHTML = renderLogin(); break;
        case "registro": app.innerHTML = renderRegistro(); break;
        case "catalogo": app.innerHTML = renderCatalogo(); break;
        case "detalleLibro": app.innerHTML = renderDetalleLibro(); break;
        case "usuario": app.innerHTML = renderUsuario(); break;
        case "misPrestamos": app.innerHTML = renderMisPrestamos(); break;
        case "dashboard": app.innerHTML = renderDashboard(); break;
        case "libros": app.innerHTML = renderLibrosAdmin(); break;
        case "autores": app.innerHTML = renderAutoresAdmin(); break;
        case "categorias": app.innerHTML = renderCategoriasAdmin(); break;
        case "usuarios": app.innerHTML = renderUsuariosAdmin(); break;
        case "prestamos": app.innerHTML = renderPrestamosAdmin(); break;
        default: app.innerHTML = renderIndex(); break;
    }
}

render();
</script>
